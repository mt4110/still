name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Install Go for Docker template tests
      if: runner.os == 'macOS'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.25'
        cache: false
    - name: Check format
      run: cargo fmt --all -- --check
    - name: Test CLI
      run: cargo test --locked --verbose
    - name: Build
      run: cargo build --locked --release --features desktop --bins
    - name: Run tests
      run: cargo test --locked --features desktop --verbose
    - name: Run clippy
      run: cargo clippy --locked --all-targets --features desktop -- -D warnings
    - name: Package Apple Silicon app
      if: runner.os == 'macOS'
      run: |
        scripts/build-macos-app.sh target/release/still target/release/still-desktop 0.2.0 target/still.app
        ditto -c -k --sequesterRsrc --keepParent target/still.app target/still-macos-arm64.zip
    - name: Upload Apple Silicon app
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: still-macos-arm64
        path: target/still-macos-arm64.zip
        if-no-files-found: error
    - name: Verify Windows package layout
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
        $tool = Get-ChildItem "$sdk\*\x64\makeappx.exe" -File |
          Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
          Select-Object -First 1
        if (-not $tool) { throw 'Windows SDK MakeAppx not found' }
        $package = 'target\still-ci.msix'
        .\scripts\build-windows-msix.ps1 -BinaryPath target\release\still.exe -DesktopBinaryPath target\release\still-desktop.exe -PackageName Still.PackageTest -Publisher 'CN=Still Package Test' -PublisherDisplayName 'Still Package Test' -DisplayName still -Version 1.0.0.0 -MakeAppxPath $tool.FullName -OutputPath $package
        $unpacked = Join-Path $env:RUNNER_TEMP 'still-package-test'
        & $tool.FullName unpack /p $package /d $unpacked
        if ($LASTEXITCODE -ne 0) { throw 'MakeAppx unpack failed' }
        foreach ($exe in 'still.exe','still-desktop.exe') {
          if ((Get-FileHash "target\release\$exe").Hash -ne (Get-FileHash "$unpacked\$exe").Hash) {
            throw "Packaged executable differs from release build: $exe"
          }
        }
