[package]
name = "still"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "Non-destructive, safety-first disk cleaner for macOS"
license-file = "LICENSE" # Source-available as requested

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
crossterm = "0.27"
directories = "5.0"
libc = "0.2"
globset = "=0.4.15"
humansize = "2.1"
ignore = "0.4"
lazy_static = "1.4"
ratatui = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
trash = "3.2"
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.8"
